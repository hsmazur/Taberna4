<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - Taberna do Dragão</title>
    <link rel="stylesheet" href="../universal.css">
    <link rel="stylesheet" href="pedidoUsuarios.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="../img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
</head>
<body>
    <header id="header"> 
        <img id="logo" src="../img/logo.png" alt="Taberna do Dragão">
        <div>
            <h1>Meus Pedidos</h1>
            <h2>Taberna do Dragão</h2>
        </div>
    </header>
    <header id="header2">
        <h3>Histórico de Pedidos</h3>
    </header>
    
    <main class="container">
        <div class="cabecalho-pedidos">
            <h2>📜 Seus Pedidos Anteriores</h2>
            <p id="info-usuario">Carregando...</p>
        </div>

        <div id="filtros-pedidos" class="filtros">
            <button class="btn-filtro ativo" data-filtro="todos">Todos</button>
            <button class="btn-filtro" data-filtro="Aprovado">Aprovados</button>
            <button class="btn-filtro" data-filtro="Pendente">Pendentes</button>
            <button class="btn-filtro" data-filtro="Cancelado">Cancelados</button>
        </div>

        <div id="lista-pedidos" class="lista-pedidos">
            <div class="loading">
                <p>🍖 Carregando seus pedidos...</p>
            </div>
        </div>

        <div id="mensagem-vazio" class="mensagem-vazio" style="display: none;">
            <img src="https://cdn-icons-png.flaticon.com/128/2921/2921222.png" alt="Sem pedidos">
            <h3>Você ainda não fez nenhum pedido</h3>
            <p>Que tal experimentar nossos deliciosos lanches?</p>
            <a href="../menu.html" class="btn-voltar">Ver Cardápio</a>
        </div>
    </main>
    
    <footer id="final">
        <a href="../menu.html" class="btn-link">← Voltar ao Menu</a>
        <br><br>
        <h3>Taberna do Dragão &copy; 2025</h3>
    </footer>

    <script src="pedidoUsuarios.js"></script>
</body>
</html>
